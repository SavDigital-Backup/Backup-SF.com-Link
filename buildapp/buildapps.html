<!DOCTYPE html><html lang="en"><head><meta charset="us-ascii">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savoury Digital Factory</title>
    
    <!-- Pastikan path CSS ini benar sesuai struktur folder di server Anda -->
    <link rel="stylesheet" href="../Masterweb2025/final_website/styles.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="shortcut icon" href="../Masterweb2025/final_website/images/faviconnew.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            font-family: 'Inter', sans-serif;
            background-color: #697280; /* Fallback sementara jika CSS gagal load */
        }

        /* Ikon Home di Pojok Kiri Atas */
        .home-btn {
            position: absolute;
            top: 20px;
            left: 30px;
            color: #ffffff; 
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            transition: background 0.3s;
            z-index: 10;
        }

        .home-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15vh;
            margin-bottom: 40px;
        }

        .logo {
            width: 80px; 
            margin-bottom: 10px;
            color: white; 
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 1px;
            color: #ffffff; 
        }

        .menu-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; 
            width: 100%;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            width: 250px; 
            height: 100px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .menu-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .menu-item .icon {
            margin-bottom: 8px;
        }

        .menu-item svg {
            width: 28px;
            height: 28px;
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: #ffffff;
            opacity: 0.7;
        }
    </style>
</head>

<body dir="ltr" spellcheck="false" style="direction: ltr; min-height: 901px;">

    <!-- Ikon Home -->
    <p><a href="http://savouryfactory.com" class="home-btn" title="Back to Home">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
    </a>

    </p><div class="container" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        
        <header>
            <div class="logo-container">
                <img src="../Masterweb2025/final_website/images/savlogo.png" alt="Logo" class="logo">
            </div>
            <h1>BUILDAPP</h1>
        </header>
        
        <main class="menu-grid">
            <!-- Ikon Briefcase (Tas Kerja) untuk Staff & Management -->
            <a href="https://buildapp.unilever.com/portada.php" class="menu-item" target="_blank" style="background-color: #4CAF50;">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                </div>
                <span>Login with Unilever Email</span>
            </a>
            
            <!-- Ikon ID Card (Kartu Identitas) untuk Karyawan -->
            <a href="https://buildapp.unilever.com/login.php" class="menu-item" target="_blank" style="background-color: #CC0000;">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <circle cx="9" cy="11" r="3"></circle>
                        <path d="M15 15h2"></path>
                        <path d="M15 11h4"></path>
                        <path d="M5 19c.6-1.5 2.1-2.5 4-2.5s3.4 1 4 2.5"></path>
                    </svg>
                </div>
                <span>Login with NIP &amp; Password</span>
            </a>
        </main>
        
        <footer>
            www.savouryfactory.com
        </footer>
    </div>
    

</body></html>
